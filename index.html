<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>評分系統（五構面版）</title>
  <style>
    :root{ 
      --bg: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 50%, #e0f2fe 100%);
      --card: #fff;
      --muted: #6b7280;
      --primary: #1e3a8a;
      --border: #e5e7eb;
      --accent: #eceff1;
      --accent-border: #b0bec5;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,"Noto Sans TC",sans-serif;
      background: var(--bg);
      background-attachment: fixed;
      color:#111827;
      min-height: 100vh;
    }
    body::before {
      content: '';
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-image: radial-gradient(circle at 20% 50%, rgba(59, 130, 246, 0.1) 0%, transparent 50%), radial-gradient(circle at 80% 20%, rgba(30, 58, 138, 0.1) 0%, transparent 50%);
      pointer-events: none; z-index: -1;
    }
    .banner-hero { width: 100%; text-align: center; margin: 20px 0 40px 0; position: relative; z-index: 1; }
    .banner-hero img { max-width: min(1024px, 90%); height: auto; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); border: 2px solid rgba(255,255,255,0.1); }
    .wrap{ max-width:1024px; margin: 0 auto 42px auto; padding:24px; background: rgba(255,255,255,0.95); border:1px solid rgba(255,255,255,0.2); border-radius:16px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); backdrop-filter: blur(10px); }
    h1{margin:0 0 8px 0;font-size:24px;color:var(--primary);}
    .sub{color:var(--muted);font-size:14px;margin-bottom:16px}
    .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:12px 0}
    label{font-weight:600}
    select,input,textarea,button{font-size:16px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:#fff}
    select,input{min-width:120px}
    input[type=number]{width:110px}
    button{cursor:pointer}
    button.primary{background:var(--primary);color:#fff}
    .hint{color:#b91c1c;font-weight:700}
    .scoreBox{ margin-left:auto; background: var(--accent); padding:10px 14px; border-radius:10px; border:1px solid var(--accent-border); box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .scoreBox b{font-size:18px;color:var(--primary);}
    .block{border:1px solid var(--border);border-radius:14px;margin:18px 0;overflow:hidden}
    .block>header{ display:flex; justify-content:space-between; align-items:center; background: var(--accent); padding:10px 14px; border-bottom:1px solid var(--accent-border); }
    .block>header h3{margin:0;font-size:16px;color:var(--primary);}
    .grid{display:grid;grid-template-columns: 1fr 140px;gap:12px;padding:14px}
    .grid label{align-self:center}
    textarea{width:100%;min-height:100px}
    .muted{color:var(--muted)}
    .msg{margin-left:8px}
    .pill{padding:4px 8px;border-radius:999px;background:#eef2ff;color:#3730a3;border:1px solid #c7d2fe;font-size:12px}
    .badge{ padding:2px 8px; border-radius:6px; border:1px solid var(--accent-border); background: var(--accent); color: var(--primary); font-size:12px; font-weight: 600; }
    .footer{margin-top:8px;color:var(--muted);font-size:12px}
    .divider{height:1px;background:var(--border);margin:16px 0}
    .link{color:#2563eb;text-decoration:none}
    .link:hover{text-decoration:underline}
    table th, table td{padding:6px 4px}
    @media (max-width: 1024px) {
      .banner-hero { margin: 10px 0 30px 0; }
      .banner-hero img { max-width: 95%; border-radius: 12px; }
      .wrap { margin: 0 20px 30px 20px; padding: 20px; }
    }
    .cards{
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 16px;
      margin: 18px 0;
    }
    .block{
      margin: 0;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 6px 16px rgba(0,0,0,0.06);
      position: relative;
      border-left: 6px solid var(--sec-color, var(--primary));
    }
    .block>header{
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8fafc;
      padding: 12px 16px;
      border-bottom: 1px solid var(--accent-border);
    }
    .block>header h3{
      margin: 0;
      font-size: 18px;
      color: var(--sec-color, var(--primary));
      letter-spacing: .2px;
    }
    .grid{
      padding: 12px 16px 16px;
      gap: 10px;
      grid-template-columns: 1fr 160px;
    }
    .badge{
      background: #eef2ff;
      color: var(--sec-color, var(--primary));
      border-color: #c7d2fe;
    }
    #secI{ --sec-color:#3b82f6; }
    #secM{ --sec-color:#10b981; }
    #secT{ --sec-color:#f59e0b; }
    #secF{ --sec-color:#ef4444; }
    #secE{ --sec-color:#8b5cf6; }
    @media (max-width: 420px){
      .grid{ grid-template-columns: 1fr 120px; }
    }
    #myList table{ table-layout: fixed; }
    #myList th:nth-child(3), #myList td:nth-child(3){ width: 90px; padding-right: 12px; text-align: right; }
    #myList th:nth-child(5), #myList td:nth-child(5){ min-width: 220px; padding-left: 16px; }
    #myList th:nth-child(6), #myList td:nth-child(6){ padding-left: 16px; }
    #finalTableWrap table{ table-layout: fixed; }
    #finalTableWrap th:nth-child(3), #finalTableWrap td:nth-child(3){ width: 90px; padding-right: 12px; text-align: right; }
    #finalTableWrap th:nth-child(4), #finalTableWrap td:nth-child(4){ width: 70px; text-align: center; }
    #finalTableWrap th:nth-child(5), #finalTableWrap td:nth-child(5){ min-width: 220px; padding-left: 16px; }
    #title{ font-size: 28px; }
    .sub{ font-size: 18px; }
    .sub .hint{ font-size: 18px; }
  </style>
</head>
<body>
  <div class="banner-hero">
    <img src="https://startup.sme.gov.tw/home/upload/event/20250715040629wvp.jpg" alt="2025創櫃菁英選拔會" />
  </div>

  <div class="wrap">
    <h1 id="title">評分系統（五構面版）</h1>
    <div class="sub"><span class="hint">各構面輸入分別有上限 30、30、20、10、10分，可輸入到小數點後兩位。</span></div>

    <div class="row">
      <label for="project">決選公司</label>
      <select id="project"></select>
      <button id="btnLast">查看評分</button>
      <button id="btnList">查看所有公司評分</button>
      <button id="btnFinal"><span class="hint">23家成績最終確認</span></button>
      <div class="scoreBox">得分計算：<b id="liveTotal">0.00</b></div>
    </div>

    <div class="cards">
      <section class="block" id="secI">
        <header><h3>一、產品創新與行銷 <span class="badge">上限30分</span></h3></header>
        <div class="grid">
          <label for="I">產品創新與行銷整體評分</label>
          <input type="number" id="I" min="0" max="30" step="0.01" value="0">
        </div>
      </section>
      <section class="block" id="secM">
        <header><h3>二、市場需求與規模 <span class="badge">上限30分</span></h3></header>
        <div class="grid">
          <label for="M">市場需求與規模整體評分</label>
          <input type="number" id="M" min="0" max="30" step="0.01" value="0">
        </div>
      </section>
      <section class="block" id="secT">
        <header><h3>三、技術門檻 <span class="badge">上限20分</span></h3></header>
        <div class="grid">
          <label for="T">技術門檻整體評分</label>
          <input type="number" id="T" min="0" max="20" step="0.01" value="0">
        </div>
      </section>
      <section class="block" id="secF">
        <header><h3>四、財務狀況 <span class="badge">上限10分</span></h3></header>
        <div class="grid">
          <label for="F">財務狀況整體評分</label>
          <input type="number" id="F" min="0" max="10" step="0.01" value="0">
        </div>
      </section>
      <section class="block" id="secE">
        <header><h3>五、經營團隊 <span class="badge">上限10分</span></h3></header>
        <div class="grid">
          <label for="E">經營團隊整體評分</label>
          <input type="number" id="E" min="0" max="10" step="0.01" value="0">
        </div>
      </section>
    </div>

    <div class="row">
      <label for="comment">委員意見</label>
      <textarea id="comment" maxlength="300" placeholder="（可留空，最多 300 字）"></textarea>
    </div>

    <div class="row">
      <button class="primary" id="btnSave">送出評分</button>
      <span class="msg muted" id="msg"></span>
    </div>

    <section class="block" id="myList" style="display:none">
      <header>
        <h3>我的評分總覽</h3>
        <span class="muted">按一下「檢視」，即可切換至您對該公司的上一次評分紀錄，並進行修改。</span>
      </header>
      <div id="myListBody" style="padding:14px"></div>
    </section>

    <div class="divider"></div>
    <div class="footer">前端：GitHub Pages．後端：Google Apps Script．</div>

    <div id="finalModal" style="position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:9999;">
      <div style="width:min(960px,90vw);max-height:80vh;overflow:auto;background:#fff;border-radius:14px;border:1px solid #e5e7eb;box-shadow:0 20px 40px rgba(0,0,0,.2);">
        <header style="padding:14px 16px;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;">
          <h3 style="margin:0;font-size:16px">最終確認 — 我打的所有分數</h3>
          <button id="finalClose" class="ghost" style="padding:6px 10px">關閉</button>
        </header>
        <div style="padding:14px 16px">
          <div id="finalHint" class="muted" style="margin-bottom:8px"></div>
          <div id="finalTableWrap" style="overflow:auto;border:1px solid #e5e7eb;border-radius:10px">
            <table style="width:100%;border-collapse:collapse">
              <thead>
                <tr>
                  <th style="text-align:left;border-bottom:1px solid #e5e7eb;padding:8px">簡報順序</th>
                  <th style="text-align:left;border-bottom:1px solid #e5e7eb;padding:8px">決選公司</th>
                  <th style="text-align:right;border-bottom:1px solid #e5e7eb;padding:8px">總分</th>
                  <th style="text-align:center;border-bottom:1px solid #e5e7eb;padding:8px">名次</th>
                  <th style="text-align:left;border-bottom:1px solid #e5e7eb;padding:8px">最後更新</th>
                  <th style="text-align:left;border-bottom:1px solid #e5e7eb;padding:8px">操作</th>
                </tr>
              </thead>
              <tbody id="finalTbody"></tbody>
            </table>
          </div>
          <div style="margin-top:12px">
            <label style="display:flex;gap:8px;align-items:flex-start">
              <input type="checkbox" id="finalCheck">
              <span>我已核對上表內容，<b>確認這是我最終要送出的分數</b><span class="hint">(注意：送出後無法修改)。</span></span>
            </label>
          </div>
          <div style="margin-top:12px;display:flex;gap:8px;justify-content:flex-end">
            <button id="finalSubmit" class="primary">送出20家成績最終確認</button>
          </div>
          <div id="finalMsg" class="muted" style="margin-top:8px"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ==== 後端 Web App 入口（換成部署的網址）====
    const API_URL = 'https://script.google.com/macros/s/AKfycby4ySNKWJsDz73Wz2lsT9_tNYIACM4U-K7oDm4twjrg20tdDzDqanVNDyLEwX9rBP5Y/exec'; //46版--提升速度

    const LIMITS = { I:30, M:30, T:20, F:10, E:10 };
    const NAMES = { I:'產品創新與行銷', M:'市場需求與規模', T:'技術門檻', F:'財務狀況', E:'經營團隊' };
    const IDS = ['I','M','T','F','E'];

    const $ = q => document.querySelector(q);
    const params = new URLSearchParams(location.search);
    const JUDGE = decodeURIComponent(params.get('judge')||'').trim();

    // 本地快取
    let TOTAL_PROJECTS = 0;
    const PROJECTS_MAP = new Map(); // id -> {team, hasScore}
    let LAST_LIST = { at: 0, items: [] }; // 60s 內重用

    function toast(msg, ok=true){ const m=$('#msg'); m.textContent=msg; m.style.color= ok?'#059669':'#b91c1c'; }
    function jsonp(params){
      return new Promise((resolve,reject)=>{
        const cb = 'cb_' + Math.random().toString(36).slice(2);
        window[cb] = (data)=>{ resolve(data); cleanup(); };
        const s = document.createElement('script');
        const qs = new URLSearchParams(params);
        qs.set('callback', cb);
        s.src = API_URL + (API_URL.includes('?')?'&':'?') + qs.toString();
        s.onerror = ()=>{ reject(new Error('連線失敗（JSONP）')); cleanup(); };
        document.head.appendChild(s);
        function cleanup(){ delete window[cb]; s.remove(); }
      });
    }
    async function apiGET(q){ const p = Object.fromEntries(new URLSearchParams(q)); return jsonp(p); }
    async function apiPOST(body){ return jsonp(body); }

    // 元素與限制
    const els = IDS.map(id=>document.getElementById(id));
    IDS.forEach(id=>{
      const el = document.getElementById(id);
      el.min = 0; el.max = LIMITS[id]; el.step = '0.01';
    });
    
    // （新增）改善輸入體驗（行動裝置顯示含小數點鍵盤）
    IDS.forEach(id=>{
      const el = document.getElementById(id);
      el.setAttribute('inputmode', 'decimal'); // 僅提示鍵盤，不會強制驗證
    });

    // （新增）檢查單一欄位，設定自訂錯誤
    function validateField(el){
      const name = NAMES[el.id] || el.id;
      const max  = LIMITS[el.id] || 0;
      el.setCustomValidity('');
    
      if (el.validity.badInput) {
        el.setCustomValidity(`「${name}」請輸入數字`);
        return false;
      }
    
      const n = Number.parseFloat(el.value);
      if (!Number.isFinite(n)) {
        el.setCustomValidity(`「${name}」請輸入數字`);
        return false;
      }
    
      if (n < 0 || n > max) {
        el.setCustomValidity(`「${name}」需介於 0 ~ ${max}`);
        return false;
      }
      return true;
    }
    
    // （新增）統一檢查所有欄位並同步送出按鈕狀態
    function validateAll(){
      let ok = true;
      for (const el of els){
        const good = validateField(el);
        if (!good) ok = false;
      }
      $('#btnSave').disabled = !ok;
      return ok;
    }

    
    // （修改）即時計分避免將無效輸入當成 0
    function liveTotal(){
      let t = 0;
      els.forEach(el=>{
        const v = Number.parseFloat(el.value);
        if (Number.isFinite(v)) t += v;
      });
      $('#liveTotal').textContent = (Math.round(t * 100) / 100).toFixed(2);
      return t;
    }

    function resetScores(){ els.forEach(el=>el.value=0); $('#comment').value=''; liveTotal(); }
    function getSelectedProject(){
      const sel = $('#project'); const pid = sel.value;
      if(!pid) return null;
      const p = PROJECTS_MAP.get(pid) || { team:'' };
      return { id: pid, team: p.team, hasScore: !!p.hasScore };
    }
    function setHasScore(pid, val){
      const p = PROJECTS_MAP.get(pid);
      if (p){ p.hasScore = !!val; PROJECTS_MAP.set(pid, p); }
      // 更新 option 顯示
      const sel = $('#project');
      const opt = [...sel.options].find(o=>o.value===pid);
      if (opt && p){ opt.textContent = `${pid}｜${p.team}${p.hasScore?'（已評分）':''}`; }
    }

    async function loadInit(){
      const d = await apiGET(`action=init&judge=${encodeURIComponent(JUDGE)}`);
      $('#title').textContent = JUDGE? `${JUDGE} 評選委員` : '評分系統（未帶入評審姓名）';
      const sel = $('#project'); sel.innerHTML='';
      const projects = d.projects || [];
      TOTAL_PROJECTS = projects.length;
      PROJECTS_MAP.clear();
      if(!projects.length){
        sel.innerHTML = '<option value="">（尚無隊伍）</option>';
        return;
      }
      for(const p of projects){
        PROJECTS_MAP.set(String(p.id), { team: p.team||'', hasScore: !!p.hasScore });
        const opt = document.createElement('option');
        opt.value = String(p.id);
        opt.textContent = `${p.id}｜${p.team}${p.hasScore?'（已評分）':''}`;
        sel.appendChild(opt);
      }
    }

    function fillScores(map){
      if(!map) return;
      for(const id of IDS){
        const el = document.getElementById(id);
        const v = map[id] ?? 0;
        el.value = v;
      }
      liveTotal();
    }

    async function loadLast(){
      const p = getSelectedProject(); if(!p) return toast('請先選擇團隊', false);
      const data = await apiGET(`action=last&judge=${encodeURIComponent(JUDGE)}&projectId=${encodeURIComponent(p.id)}`);
      if(!data || !data.items){ toast('沒有上一筆評分'); resetScores(); return; }
      fillScores(data.items); $('#comment').value = data.comment || ''; toast('已載入前一次評分');
    }

    async function getMyListCached(ttlMs=60000){
      const now = Date.now();
      if (now - LAST_LIST.at < ttlMs) return LAST_LIST.items;
      const res = await apiGET(`action=list&judge=${encodeURIComponent(JUDGE)}`);
      LAST_LIST = { at: now, items: res.items || [] };
      return LAST_LIST.items;
    }

    function renderMyList(items){
      const box = document.getElementById('myList');
      const body = document.getElementById('myListBody');
      if(!items || !items.length){
        body.innerHTML = '<div class="muted">尚無評分紀錄</div>';
        box.style.display = '';
        return;
      }
      const data = [...items]
        .map(it => ({...it, totalNum: Number(it.total)}))
        .sort((a,b)=>{
          const ax = Number.isFinite(a.totalNum) ? a.totalNum : -Infinity;
          const bx = Number.isFinite(b.totalNum) ? b.totalNum : -Infinity;
          return bx - ax;
        });
      let lastScore = null, lastRank = 0, realRank = 0;
      data.forEach(it=>{
        realRank++;
        if (it.totalNum === lastScore){ it.rank = lastRank; }
        else { it.rank = realRank; lastRank = realRank; lastScore = it.totalNum; }
      });
      const rows = data.map(it=>{
        const time = it.updatedAt ? new Date(it.updatedAt) : null;
        const timeStr = time ? time.toLocaleString('zh-TW') : '';
        const totalStr = Number.isFinite(Number(it.total)) ? Number(it.total).toFixed(2) : '';
        return `
          <tr>
            <td>${it.projectId}</td>
            <td>${it.team||''}</td>
            <td style="text-align:right">${totalStr}</td>
            <td style="text-align:center">${it.rank}</td>
            <td style="text-align:left">${timeStr}</td>
            <td><button class="ghost" data-pid="${it.projectId}">檢視</button></td>
          </tr>`;
      }).join('');
      body.innerHTML = `
        <div style="overflow:auto">
          <table style="width:100%; border-collapse:collapse">
            <thead>
              <tr>
                <th style="text-align:left;">簡報順序</th>
                <th style="text-align:left;">決選公司</th>
                <th style="text-align:right;">總分</th>
                <th style="text-align:center;">名次</th>
                <th style="text-align:left;">最後更新</th>
                <th style="text-align:left;">操作</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;
      box.style.display = '';
      body.querySelectorAll('button[data-pid]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const pid = btn.getAttribute('data-pid');
          const sel = document.getElementById('project');
          const opt = [...sel.options].find(o=>o.value===pid);
          if(opt){
            sel.value = opt.value;
            resetScores();
            loadLast().catch(()=>{});
            toast(`已切換至 ${pid}，並載入上一筆評分`);
            window.scrollTo({ top:0, behavior:'smooth' });
          }else{
            toast(`名單中找不到編號 ${pid}（可能未在「比賽隊伍列表」）`, false);
          }
        });
      });
    }

    async function loadMyScores(){
      const items = await getMyListCached();
      renderMyList(items);
    }

    function computeSortedWithRank(items){
      const data = [...(items||[])]
        .map(it => {
          const totalNum = Number(it.total);
          const updatedAtStr = it.updatedAt ? new Date(it.updatedAt).toLocaleString('zh-TW') : '';
          return { ...it, totalNum, updatedAtStr };
        })
        .sort((a,b)=>{
          const ax = Number.isFinite(a.totalNum) ? a.totalNum : -Infinity;
          const bx = Number.isFinite(b.totalNum) ? b.totalNum : -Infinity;
          return bx - ax;
        });
      let lastScore = null, lastRank = 0, realRank = 0;
      data.forEach(it=>{
        realRank++;
        if (it.totalNum === lastScore){ it.rank = lastRank; }
        else { it.rank = realRank; lastRank = realRank; lastScore = it.totalNum; }
      });
      return data;
    }

    async function openFinalModal(){
      const modal = document.getElementById('finalModal');
      const tbody = document.getElementById('finalTbody');
      const hint  = document.getElementById('finalHint');
      const msg   = document.getElementById('finalMsg');
      const chk   = document.getElementById('finalCheck');
      const btnSubmit = document.getElementById('finalSubmit');

      msg.textContent = '';
      chk.checked = false;
      modal.style.display = 'flex';
      tbody.innerHTML = `<tr><td colspan="6" style="padding:12px">讀取中…</td></tr>`;

      const rawItems = await getMyListCached();
      const data = computeSortedWithRank(rawItems);

      if (!data.length){
        tbody.innerHTML = '<tr><td colspan="6" style="padding:12px">尚無評分紀錄</td></tr>';
      }else{
        tbody.innerHTML = data.map(it=>{
          const totalStr = Number.isFinite(it.totalNum) ? it.totalNum.toFixed(2) : '';
          return `
            <tr>
              <td style="padding:8px;border-bottom:1px solid #e5e7eb">${it.projectId}</td>
              <td style="padding:8px;border-bottom:1px solid #e5e7eb">${it.team||''}</td>
              <td style="padding:8px;border-bottom:1px solid #e5e7eb;text-align:right">${totalStr}</td>
              <td style="padding:8px;border-bottom:1px solid #e5e7eb;text-align:center">${it.rank}</td>
              <td style="padding:8px;border-bottom:1px solid #e5e7eb">${it.updatedAtStr}</td>
              <td style="padding:8px;border-bottom:1px solid #e5e7eb">
                <button class="ghost" data-pid="${it.projectId}">修改</button>
              </td>
            </tr>`;
        }).join('');
      }

      hint.innerHTML = `已評隊伍數：<b>${rawItems.length}</b>／全部隊伍數：<b>${TOTAL_PROJECTS}</b>。${rawItems.length<TOTAL_PROJECTS ? '（尚未評完，不能送出20家成績最終確認）' : ''}`;

      tbody.querySelectorAll('button[data-pid]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const pid = btn.getAttribute('data-pid');
          const sel = document.getElementById('project');
          const opt = [...sel.options].find(o=>o.value===pid);
          if (opt) {
            sel.value = opt.value;
            resetScores();
            loadLast().catch(()=>{});
            toast(`已切換至 ${pid}，並載入上一筆評分`);
            modal.style.display = 'none';
            window.scrollTo({ top: 0, behavior: 'smooth' });
          } else {
            toast(`名單中找不到編號 ${pid}（可能未在「比賽隊伍列表」）`, false);
          }
        });
      });

      const syncSubmitDisabled = ()=>{
        btnSubmit.disabled = (rawItems.length < TOTAL_PROJECTS) || !chk.checked;
      };
      chk.onchange = syncSubmitDisabled;
      syncSubmitDisabled();
    }

    async function save(){
      const p = getSelectedProject(); const btn=$('#btnSave');
      if(!p) return toast('請先選擇團隊', false);
      // === 新增：整體檢核與聚焦第一個無效欄位 ===
      if (!validateAll()){
        const firstBad = els.find(el => !el.checkValidity());
        if (firstBad){ firstBad.reportValidity(); firstBad.focus(); }
        return;
      }
    const scores = {};
    els.forEach(el=>{
      const n = Number.parseFloat(el.value);
      const name = NAMES[el.id] || el.id;
      const max  = LIMITS[el.id] || 0;
  
      if (!Number.isFinite(n)){
        el.setCustomValidity(`「${name}」請輸入數字`);
        el.reportValidity(); el.focus(); throw new Error(`「${name}」請輸入數字`);
      }
      if (n < 0 || n > max){
        el.setCustomValidity(`「${name}」需介於 0 ~ ${max}`);
        el.reportValidity(); el.focus(); throw new Error(`「${name}」需介於 0 ~ ${max}`);
      }
      el.setCustomValidity('');
  
      const rounded = Math.round(n * 100) / 100; // 四捨五入兩位
      el.value = rounded.toFixed(2);             // 回填兩位顯示字串
      scores[el.id] = rounded;                   // 送出用數值
    });

      const body = {
        action:'save',
        data: JSON.stringify({
          judge:JUDGE,
          projectId:p.id,
          team:p.team,
          scores,
          comment:$('#comment').value.trim()
        })
      };
      
      btn.disabled=true; btn.textContent='送出中…';
      try{
        const res = await apiPOST(body);
        if (!res || res.ok === false) { throw new Error(res?.error || '後端回傳失敗'); }
        const total = Number(res.total);
        if (!Number.isFinite(total)) { throw new Error('後端未回傳總分（total）。'); }
        toast(`已送出，總分 ${total.toFixed(2)}`);
        setHasScore(p.id, true);
        LAST_LIST = { at: 0, items: [] }; // 使清單快取失效，確保稍後重抓
        checkAndPromptFinal();
      }catch(e){
        toast(e.message || '送出失敗', false);
      }finally{
        btn.disabled=false; btn.textContent='送出評分';
      }
    }

    function checkAndPromptFinal(){
      getMyListCached().then(items=>{
        if (TOTAL_PROJECTS > 0 && items.length >= TOTAL_PROJECTS){
          openFinalModal().catch(()=>toast('讀取失敗',false));
        }
      }).catch(()=>{});
    }

    function closeWindowGracefully(){
      try { window.close(); } catch(e) {}
      setTimeout(()=>{
        if (!window.closed){
          try { window.open('', '_self'); window.close(); } catch(e){}
        }
      }, 300);
      setTimeout(()=>{ if (!window.closed) location.href = 'about:blank'; }, 900);
    }

    async function submitFinalConfirm(){
      const chk = document.getElementById('finalCheck');
      const msg = document.getElementById('finalMsg');
      if(!chk.checked){
        msg.textContent = '請先勾選確認聲明。';
        msg.style.color = '#b91c1c';
        return;
      }
      msg.textContent = '送出中…';
      msg.style.color = '#6b7280';
      try{
        const res = await apiPOST({ action:'confirm', data: JSON.stringify({ judge: JUDGE }) });
        if (!res || res.ok === false) throw new Error(res?.error || '後端回傳失敗');
        msg.textContent = '感謝您的評分';
        msg.style.color = '#059669';
        setTimeout(()=>{ closeWindowGracefully(); }, 800);
      }catch(e){
        msg.textContent = e.message || '送出失敗';
        msg.style.color = '#b91c1c';
      }
    }

    // 綁定事件
    // 輸入時即時驗證與更新總分，離焦時自動四捨五入兩位
    els.forEach(el=>{
      el.addEventListener('input', ()=>{
        validateField(el);
        el.reportValidity(); // 顯示提示泡泡
        validateAll();
        liveTotal();
      });
    
      el.addEventListener('blur', ()=>{
        const v = Number.parseFloat(el.value);
        if (Number.isFinite(v)) {
          const s = String(el.value || '');
          const m = s.match(/\.(\d+)/);
          if (m && m[1].length > 2) {
            const rounded = Math.round(v * 100) / 100; // 四捨五入
            el.value = rounded.toFixed(2);             // 兩位顯示
          }
        }
        validateField(el);
        validateAll();
        liveTotal();
      });
    });

    $('#btnSave').addEventListener('click', ()=>{ save().catch(e=>toast(e.message||'送出失敗', false)); });
    $('#btnLast').addEventListener('click', ()=>{ loadLast().catch(e=>toast(e.message||'讀取失敗', false)); });
    $('#btnList').addEventListener('click', ()=>{ getMyListCached().then(renderMyList).catch(()=>toast('讀取失敗', false)); });
    $('#project').addEventListener('change', ()=>{ resetScores(); toast('已切換團隊，請輸入新分數'); });
    $('#btnFinal').addEventListener('click', ()=>{ openFinalModal().catch(()=>toast('讀取失敗',false)); });
    $('#finalClose').addEventListener('click', ()=>{ document.getElementById('finalModal').style.display='none'; });
    $('#finalSubmit').addEventListener('click', ()=>{ submitFinalConfirm().catch(()=>{}); });

    // 初始化
    liveTotal();
    loadInit()
      .then(()=> checkAndPromptFinal())
      .catch(e=> toast(e.message||'初始化失敗', false));
  </script>
</body>
</html>
